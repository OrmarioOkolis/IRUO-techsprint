---
# Instalacija Moodlea (PHP/Apache/MariaDB) na VM cija je pohrana vec
# pripremljena rolom mount_storage (moodledata = Blob mount, MariaDB data dir
# = data disk).

# ---------------------------------------------------------------------------
# Live testirano 9.9.2026 na OpenStack RHEL8 sandboxu, dug istrazni niz: Apache
# (preko Remi-inog php:remi-8.3 moda) servira PHP preko FPM/FastCGI (ne
# mod_php), a mysqli_connect() prema lokalnom MariaDB unix socketu je
# ISKLJUCIVO iz php-fpm worker procesa pucao s "Permission denied" -
# 'PHP Fatal error: Uncaught mysqli_sql_exception: Permission denied'.
# Provjereno i ISKLJUCENO redom: DAC permisije (i /var/lib/mysql direktorij i
# sam .sock fajl su world-accessible), socket path mismatch (identican u
# phpinfo() i CLI-u), open_basedir (prazan), chroot (nije postavljen),
# systemd sandboxing na php-fpm.service (samo PrivateTmp=true, ne dodiruje
# /var/lib), supplementary groups (apache nema potrebu za "mysql" grupom jer
# je direktorij vec world-executable). `ausearch -m avc` NIJE pokazao NIJEDAN
# denial ni s ukljucenim dontaudit pravilima (`semodule -DB`) - definitivan
# test je bio `setenforce 0` (odmah OK) nasuprot Enforcing (odmah puca), sto
# potvrdjuje SELinux kao uzrok bez obzira na (rijedak, vjerojatno "constraint"
# tipa umjesto standardnog AVC) nedostatak log zapisa. Fino ciljanje
# konkretnog booleana/modula nije pronadjeno unatoc opseznoj istrazi, pa je
# (za ovaj projekt, ne produkcijski sustav) SELinux prebacen u permissive na
# Moodle app VM-ovima - isto vrijedi i za Azure stranu (dijeljena rola), gdje
# je bezopasno jer Moodle tamo vec radi bez ove prepreke.
# ---------------------------------------------------------------------------
- name: Postavi SELinux na permissive (php-fpm/mysqld socket - vidi napomenu iznad)
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: "^SELINUX="
    line: "SELINUX=permissive"

- name: Primijeni SELinux permissive odmah (bez cekanja na reboot)
  command: setenforce 0
  changed_when: true
  failed_when: false

# Moodle 5.1 zahtijeva PHP 8.2+. Rocky 9 AppStream default modul (php:8.1)
# nije dovoljan - koristi se Remi repozitorij (standardni izvor modernih PHP
# verzija za RHEL/Rocky) za PHP 8.3.
- name: Ukloni PHP pakete iz eventualnog starijeg modula/streama
  ansible.builtin.dnf:
    name:
      - php
      - php-cli
      - php-common
      - php-mysqlnd
      - php-gd
      - php-xml
      - php-mbstring
      - php-curl
      - php-zip
      - php-intl
      - php-soap
      - php-opcache
    state: absent

- name: Provjeri je li Remi repo vec dodan
  ansible.builtin.stat:
    path: /etc/yum.repos.d/remi.repo
  register: remi_repo_file

# EL9 (Azure Rocky 9): remi-release-9.rpm se uredno instalira preko dnf i
# povuce epel-release kao ovisnost. EL8 (OpenStack RHA rhel8 image, namjerno
# fiksiran na stari 8.2 point-release): remi-release-8.rpm zahtijeva
# "redhat-release >= 8.10" pa dnf odbija paket - instalira se izravno preko
# rpm -Uvh --nodeps (stvarna potreba je samo da se .repo fajl odlozi u
# /etc/yum.repos.d/; rpm ovisnost je konzervativan gate bez funkcionalnog
# razloga za nas slucaj). Live testirano 9.9.2026 na OpenStack sandboxu.
- name: Dodaj Remi repozitorij (EL9 - obican dnf)
  ansible.builtin.dnf:
    name: "https://rpms.remirepo.net/enterprise/remi-release-{{ ansible_distribution_major_version }}.rpm"
    state: present
    disable_gpg_check: true
  when:
    - not remi_repo_file.stat.exists
    - ansible_distribution_major_version is version('9', '>=')

- name: Preuzmi Remi release RPM (EL8)
  ansible.builtin.get_url:
    url: "https://rpms.remirepo.net/enterprise/remi-release-{{ ansible_distribution_major_version }}.rpm"
    dest: /tmp/remi-release.rpm
    mode: "0644"
  when:
    - not remi_repo_file.stat.exists
    - ansible_distribution_major_version is version('9', '<')

- name: Instaliraj Remi repozitorij (EL8 - rpm --nodeps, dnf odbija zbog redhat-release>=8.10)
  command: rpm -Uvh --nodeps /tmp/remi-release.rpm
  when:
    - not remi_repo_file.stat.exists
    - ansible_distribution_major_version is version('9', '<')

- name: Resetiraj default PHP modul stream
  # cmd: dict oblik namjerno, ne free-form string - Ansible 2.9 (RHA
  # workstation) ne podrzava FQCN modul + free-form string + extra kljuc u
  # istom tasku. Vidi CLAUDE.md (live otkriveno 9.9.2026).
  command:
    cmd: dnf module reset -y php
  changed_when: true

- name: Omoguci PHP 8.3 modul stream (Remi)
  command:
    cmd: dnf module enable -y php:remi-8.3
  changed_when: true

# ---------------------------------------------------------------------------
# Live testirano 9.9.2026 na OpenStack RHEL8 sandboxu (nakon Remi fixa):
# Remi-in php-gd paket (8.3) ovisi o novijim slikovnim bibliotekama
# (libavif.so.14, libraqm.so.0, libimagequant.so.0) kojih nema ni u jednom
# omogucenom repou (isti "star RHEL8.2 image" razlog kao Remi problem ranije)
# - "nothing provides ..." unistava CIJELU dnf transakciju (dnf install je
# atoman - jedan nerjesivi paket blokira sve ostale u istom pozivu). EPEL
# obicno nosi te biblioteke; epel-release SAM PO SEBI (za razliku od
# remi-release) nema strogi redhat-release>=8.10 zahtjev pa prolazi kroz
# obican dnf. skip_broken je dodatna sigurnosna mreza (da php-gd, ako ipak
# ostane nerjesiv, ne blokira instalaciju SVEGA ostalog - Moodle radi i bez
# GD-a, samo s degradiranom slikovnom obradom).
# ---------------------------------------------------------------------------
- name: Omoguci EPEL (EL8 - php-gd slikovne biblioteke na starom rhel8 imageu)
  ansible.builtin.dnf:
    name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
    state: present
    disable_gpg_check: true
  when: ansible_distribution_major_version is version('9', '<')

- name: Omoguci EPEL (EL9)
  # Na Rocky 9 php-gd ovisnosti se rjesavaju iz baze/AppStreama; EPEL vec
  # dolazi kao ovisnost remi-releasea. Eksplicitan install je osigurac s
  # ispravnom EL verzijom (paket je u Rocky "extras" repou, ukljucenom po defaultu).
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_distribution_major_version is version('9', '>=')

- name: Instaliraj Apache, PHP 8.3 i potrebne ekstenzije
  ansible.builtin.dnf:
    name:
      - httpd
      - php
      - php-cli
      - php-common
      - php-mysqlnd
      - php-gd
      - php-xml
      - php-mbstring
      - php-curl
      - php-zip
      - php-intl
      - php-soap
      - php-opcache
      - unzip
      - git
    state: present
    skip_broken: true

- name: Postavi max_input_vars >= 5000 (Moodle zahtjev)
  ansible.builtin.lineinfile:
    path: /etc/php.ini
    regexp: "^;?\\s*max_input_vars\\s*="
    line: "max_input_vars = 5000"
  notify: restart httpd

- name: Instaliraj firewalld (nije na minimal cloud image-u)
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Pokreni i omoguci firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Otvori HTTP port u firewalld
  command:
    cmd: firewall-cmd --permanent --add-service=http
  register: firewalld_http
  changed_when: "'ALREADY_ENABLED' not in firewalld_http.stderr"

# HA par: DB primary mora primati MariaDB (3306) od sekundarne instance.
# Bez ovoga firewalld radi "reject" s ICMP host-prohibited pa klijent vidi
# "No route to host". Pristup je i dalje ogranicen NSG-om na vlastitu spoke
# mrezu ("AllowMySQLWithinSpoke"). Samo primary - sekundarna ne slusa 3306.
- name: Otvori MySQL port u firewalld (DB primary HA para)
  command:
    cmd: firewall-cmd --permanent --add-port=3306/tcp
  register: firewalld_mysql
  changed_when: "'ALREADY_ENABLED' not in firewalld_mysql.stderr"
  when: moodle_db_primary | default(true)

- name: Primijeni firewalld promjene
  command:
    cmd: firewall-cmd --reload
  changed_when: true

# ===========================================================================
# MariaDB - datadir je vec mountan na data disk (mount_storage rola), poklapa
# se s paketnim defaultom /var/lib/mysql. Moodle 5.1 zahtijeva MariaDB 10.11+.
#
# HA PAR DIJELI JEDNU BAZU: samo DB primary instanca (prva po abecedi u dev
# grupi, npr. moodle-dev01-01 - vidi generate_inventory.py) instalira i vrti
# MariaDB; sekundarna instanca preskace CIJELI ovaj blok i spaja se na
# primarnu preko privatnog IP-a ($CFG->dbhost = moodle_db_host, vidi
# config.php.j2 + NSG AllowMySQLWithinSpoke). Bez toga svaka instanca ima
# svoju bazu/sesije pa login puca iza internog LB-a (token generira jedna,
# provjerava druga). moodledata (datoteke) je vec dijeljen preko Blob/Swift.
#
# moodle_db_primary NIJE definiran na OpenStacku / samostalnoj instanci ->
# default(true) -> ponasanje kao prije (svaka instanca svoja lokalna baza;
# tamo nema pravog LB-a pa su instance ionako samostalne - vidi
# generate_inventory_openstack.py).
# ===========================================================================
- name: MariaDB (samo DB primary HA para - sekundarna se spaja preko mreze)
  when: moodle_db_primary | default(true)
  block:
    - name: Ukloni stari mariadb-server (AppStream, prenizak za Moodle 5.1)
      ansible.builtin.dnf:
        name: mariadb-server
        state: absent

    - name: Dodaj sluzbeni MariaDB repozitorij (10.11)
      ansible.builtin.yum_repository:
        name: mariadb
        description: MariaDB 10.11
        baseurl: https://rpm.mariadb.org/10.11/rhel/$releasever/$basearch
        gpgkey: https://rpm.mariadb.org/RPM-GPG-KEY-MariaDB
        gpgcheck: true

    # EL9 (Azure Rocky 9): obican dnf. MariaDB-server iz sluzbenog mariadb.org
    # repoa povlaci MariaDB-client/-common/-shared/galera-4 kao ovisnosti; sve
    # se uredno rjesava jer je AppStream UKLJUCEN (perl(DBI)/perl(File::Copy)/
    # perl(Sys::Hostname) za MariaDB-client zive tamo) i galera-4 za EL9 ne
    # vuce zastarjele boost biblioteke.
    - name: Instaliraj MariaDB 10.11 (EL9 - obican dnf)
      ansible.builtin.dnf:
        name: MariaDB-server
        state: present
        disable_gpg_check: true
      when: ansible_distribution_major_version is version('9', '>=')

    # -----------------------------------------------------------------------
    # EL8 (OpenStack RHA rhel8 image), TRI odvojena nalaza (live 9.9.2026):
    # 1. "All matches were filtered out by modular filtering" - RHEL8
    #    AppStream ima "mariadb" MODUL (stream 10.3) koji sakriva paket istog
    #    imena iz SVIH repoa dok postoji, cak i "disable"-an. Jedini zaobilaz
    #    je --disablerepo na AppStream. (Na EL9 bi to izbacilo perl(DBI) i sl.
    #    koje MariaDB-client treba - zato EL8-only.)
    # 2. MariaDB-server ima hard "Requires: galera-4", a galera-4 na starom
    #    RHEL8.2 imageu trazi libboost_program_options.so.1.66 kojeg nema -
    #    jedini nacin je rpm -Uvh --nodeps izravno na server RPM.
    # 3. rpm --nodeps izostavlja i pakete koje STVARNO treba (MariaDB-common/
    #    -client/-shared) - ti nemaju galera/boost problem pa idu normalno
    #    preko dnf (samo s --disablerepo), PA TEK ONDA server.
    # -----------------------------------------------------------------------
    - name: Instaliraj MariaDB-common/client/shared (EL8 - bez appstream modularnog filtriranja)
      ansible.builtin.dnf:
        name:
          - MariaDB-common
          - MariaDB-client
          - MariaDB-shared
        state: present
        disable_gpg_check: true
        disablerepo: "*appstream*"
      when: ansible_distribution_major_version is version('9', '<')

    - name: Provjeri je li MariaDB-server vec instaliran (EL8)
      command: rpm -q MariaDB-server
      register: mariadb_server_rpm
      failed_when: false
      changed_when: false
      when: ansible_distribution_major_version is version('9', '<')

    - name: Kreiraj privremeni direktorij za preuzimanje MariaDB-server RPM-a (EL8)
      ansible.builtin.file:
        path: /tmp/mariadb-server-rpm
        state: directory
        mode: "0755"
      when:
        - ansible_distribution_major_version is version('9', '<')
        - mariadb_server_rpm.rc | default(1) != 0

    - name: Preuzmi MariaDB-server RPM (EL8 - rucna instalacija bez galera ovisnosti)
      command:
        cmd: dnf download MariaDB-server --disablerepo="*appstream*" --destdir=/tmp/mariadb-server-rpm
      when:
        - ansible_distribution_major_version is version('9', '<')
        - mariadb_server_rpm.rc | default(1) != 0
      changed_when: true

    - name: 'Instaliraj MariaDB-server (EL8 - rpm --nodeps, zaobilazi hard "Requires: galera-4")'
      shell:
        cmd: rpm -Uvh --nodeps /tmp/mariadb-server-rpm/MariaDB-server-*.rpm
      when:
        - ansible_distribution_major_version is version('9', '<')
        - mariadb_server_rpm.rc | default(1) != 0
      changed_when: true

    - name: Popravi vlasnistvo /var/lib/mysql nakon mounta (prije inicijalizacije)
      ansible.builtin.file:
        path: "{{ mariadb_datadir }}"
        owner: mysql
        group: mysql
        mode: "0755"

    # HA par: sekundarna instanca se spaja preko mreze, pa MariaDB mora
    # slusati na svim sucेljima (mariadb.org paket po defaultu vec slusa na
    # 0.0.0.0, ali eksplicitno je jasnije i otporno na buduce promjene
    # defaulta). Pristup je i dalje ogranicen NSG-om na vlastitu spoke mrezu.
    - name: MariaDB - slusaj na svim sucсеljima (bind-address 0.0.0.0)
      ansible.builtin.copy:
        dest: /etc/my.cnf.d/z-techsprint-bind.cnf
        content: |
          [mariadb]
          bind-address = 0.0.0.0
        owner: root
        group: root
        mode: "0644"
      register: mariadb_bind_cfg

    - name: Provjeri je li MariaDB 10.11 vec inicijaliziran (nas marker)
      ansible.builtin.stat:
        path: "{{ mariadb_datadir }}/.techsprint_mariadb_1011_initialized"
      register: mariadb_1011_marker

    - name: Ocisti stare (10.5) sistemske tablice - nekompatibilne s 10.11 (samo jednom)
      shell:
        cmd: rm -rf {{ mariadb_datadir }}/*
      when: not mariadb_1011_marker.stat.exists

    - name: Inicijaliziraj MariaDB sistemske tablice (idempotentno)
      command:
        cmd: mariadb-install-db --datadir={{ mariadb_datadir }} --user=mysql
        creates: "{{ mariadb_datadir }}/mysql/user.MYD"

    - name: Oznaci da je MariaDB 10.11 inicijalizacija zavrsena
      ansible.builtin.file:
        path: "{{ mariadb_datadir }}/.techsprint_mariadb_1011_initialized"
        state: touch
        owner: mysql
        group: mysql

    - name: Pokreni i omoguci MariaDB
      ansible.builtin.systemd:
        name: mariadb
        state: started
        enabled: true

    - name: Restartaj MariaDB da primijeni bind-address (ako je config promijenjen)
      ansible.builtin.systemd:
        name: mariadb
        state: restarted
      when: mariadb_bind_cfg is changed

    - name: Kreiraj Moodle bazu podataka
      command:
        cmd: >
          mysql -e "CREATE DATABASE IF NOT EXISTS {{ moodle_db_name }}
          CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      changed_when: true

    # HA par: Moodle se na bazu spaja preko TCP-a (i primarna instanca preko
    # svog privatnog IP-a, ne socketa - jednolika config.php), a sekundarna s
    # drugog IP-a - pa grant ide na '%' umjesto 'localhost'. Pristup je
    # ogranicen NSG-om ("AllowMySQLWithinSpoke", samo vlastita spoke mreza).
    # Na samostalnoj instanci (moodle_db_host nepostavljen -> 'localhost')
    # koristi se 'localhost' (socket veza).
    - name: Kreiraj Moodle DB korisnika i dodijeli prava (samo na moodle bazu)
      command:
        cmd: >
          mysql -e "CREATE USER IF NOT EXISTS '{{ moodle_db_user }}'@'{{ moodle_db_grant_host }}'
          IDENTIFIED BY '{{ moodle_db_password }}';
          GRANT ALL PRIVILEGES ON {{ moodle_db_name }}.* TO '{{ moodle_db_user }}'@'{{ moodle_db_grant_host }}';
          FLUSH PRIVILEGES;"
      no_log: true
      changed_when: true
      vars:
        moodle_db_grant_host: "{{ '%' if (moodle_db_host | default('localhost')) != 'localhost' else 'localhost' }}"

# Sekundarna instanca HA para koristi bazu primarne preko mreze - lokalnu
# MariaDB (ako je zaostala iz ranijeg run-a kad su instance bile samostalne)
# zaustavi i onemoguci da ne trosi RAM i ne zbunjuje. failed_when: false -
# na cistoj sekundarnoj instanci mariadb.service uopce ne postoji.
- name: Zaustavi lokalnu MariaDB na sekundarnoj instanci HA para
  ansible.builtin.systemd:
    name: mariadb
    state: stopped
    enabled: false
  failed_when: false
  when: not (moodle_db_primary | default(true))

# ---------------------------------------------------------------------------
# Moodle kod + config, dataroot pokazuje na blobfuse2-mountani direktorij
# (objektna pohrana, vidi mount_storage rolu).
# ---------------------------------------------------------------------------
- name: Dozvoli git operacije nad moodle_webroot (dubious ownership fix)
  command:
    cmd: git config --global --add safe.directory {{ moodle_webroot }}
  changed_when: true

- name: Preuzmi Moodle izvorni kod (git, tocan stabilni tag)
  # force: true - live testirano 9.9.2026: "public/config.php" je TRACKED
  # placeholder fajl u samom Moodle repou, a mi ga svaki put prepisujemo
  # (vidi "Generiraj public/config.php stub" nize) - bez force, git modul
  # na SVAKOM sljedecem run-u vidi "dirty" radno stablo i puca s "Local
  # modifications exist in repository (force=no)" prije nego uopce stigne
  # provjeriti je li verzija promijenjena. Ta datoteka je ansible-upravljana
  # namjerno, sigurno ju je odbaciti/prepisati pri svakom checkoutu.
  ansible.builtin.git:
    repo: https://github.com/moodle/moodle.git
    dest: "{{ moodle_webroot }}"
    version: "{{ moodle_version }}"
    depth: 1
    force: true
  become_user: root

- name: Postavi vlasnistvo Moodle koda na apache
  ansible.builtin.file:
    path: "{{ moodle_webroot }}"
    owner: apache
    group: apache
    recurse: true

- name: Postavi vlasnistvo moodledata (Blob mount) na apache
  ansible.builtin.file:
    path: "{{ moodle_dataroot }}"
    owner: apache
    group: apache
    mode: "0770"

- name: Generiraj Moodle config.php
  ansible.builtin.template:
    src: config.php.j2
    dest: "{{ moodle_webroot }}/config.php"
    owner: apache
    group: apache
    mode: "0640"
  no_log: true

# ---------------------------------------------------------------------------
# Live testirano 9.9.2026 na OpenStack RHEL8 sandboxu (prvi put da je puni
# playbook stigao do stvarnog HTTP zahtjeva - do sada je uvijek pucao ranije
# u lancu): HTTP 500, "require(../config.php): Failed to open stream" iz
# public/login/index.php. Moodle 5.x public/ reorganizacija (vidi i
# moodle.conf.j2/Apache Alias napomenu) znaci da su web-servirani ulazni
# skriptovi (npr. public/login/index.php) PREMJESTENI u public/, ali stvarni
# config.php i dalje zivi na checkout ROOT-u (isto mjesto kao prije, cita ga
# npr. admin/cli/install_database.php preko VLASTITOG relativnog puta koji
# ide dvije razine gore - zato je CLI instalacija ranije prosla bez greske).
# Skripte UNUTAR public/ (npr. public/login/index.php) rade `require('../
# config.php')` - JEDNU razinu gore od SVOJE lokacije (public/login/), sto
# pokazuje na public/config.php, NE na pravi config.php na root-u. Sluzbeni
# Moodle 5.x public/ obrazac zato zahtijeva MALI "stub" fajl unutar public/
# koji samo prosljedjuje na stvarni config.php - bez njega SVAKA stranica
# unutar public/ (dakle citav weB pristup) puca s HTTP 500, dok CLI
# alati (koji ne prolaze kroz public/) rade normalno - zato je ovaj bug
# ostao neotkriven kroz cijelu Terraform/mount/paket fazu.
# ---------------------------------------------------------------------------
- name: Generiraj public/config.php stub (Moodle 5.x public/ obrazac - prosljedjuje na pravi config.php)
  ansible.builtin.copy:
    dest: "{{ moodle_webroot }}/public/config.php"
    content: |
      <?php
      require(__DIR__ . '/../config.php');
    owner: apache
    group: apache
    mode: "0640"

- name: Generiraj Apache vhost za Moodle
  ansible.builtin.template:
    src: moodle.conf.j2
    dest: /etc/httpd/conf.d/moodle.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart httpd

- name: Instaliraj semanage alat (bez Python SELinux ovisnosti)
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present

- name: Postavi SELinux context za httpd na Moodle webroot
  command:
    cmd: semanage fcontext -a -t httpd_sys_rw_content_t "{{ moodle_webroot }}(/.*)?"
  register: semanage_result
  failed_when: semanage_result.rc != 0 and 'already defined' not in semanage_result.stderr
  changed_when: semanage_result.rc == 0

- name: Primijeni SELinux context (restorecon)
  command:
    cmd: restorecon -Rv {{ moodle_webroot }}
  changed_when: true

- name: Pokreni i omoguci Apache
  ansible.builtin.systemd:
    name: httpd
    state: started
    enabled: true

# Samo DB primary puni (dijeljenu) bazu - sekundarna instanca HA para gleda
# Live otkriveno 11.9.2026: RHA RHEL8 cloud image sadrzi prazne (0-byte) stub
# biblioteke (libgd, libsodium, libcapstone i cijeli AVIF/AOM/dav1d/imagequant
# lanac) koje php-gd/php-sodium/opcache dinamicki linkaju - install_database.php
# puca na "GD extension must be installed" iako je php-gd paket ispravno
# instaliran, jer su te SISTEMSKE .so datoteke prazne placeholderi u baznoj
# slici, ne nesto sto nasa rola pokvari. Reinstall vraca prave binarne datoteke.
- name: Reinstaliraj prazne stub biblioteke iz baznog RHEL8 image-a (gd/sodium/capstone lanac)
  ansible.builtin.dnf:
    name:
      - gd3php
      - libavif
      - libaom
      - libdav1d
      - libimagequant
      - capstone
    state: latest
  when: ansible_distribution_major_version == "8"

# istu bazu pa bi drugi install_database.php samo vidio da je sve vec tu.
# Na samostalnoj instanci (moodle_db_primary nepostavljen) -> default(true).
- name: Pokreni Moodle CLI instalaciju (idempotentno - preskace ako su tablice vec tu)
  command:
    cmd: >
      php admin/cli/install_database.php
      --agree-license
      --adminuser=admin --adminpass={{ moodle_admin_password }}
      --adminemail=admin@techsprint.local
      --fullname="{{ moodle_site_name }}" --shortname=TechSprint
    chdir: "{{ moodle_webroot }}"
  register: moodle_install_result
  failed_when: >
    moodle_install_result.rc != 0 and
    'already present' not in moodle_install_result.stderr
  changed_when: moodle_install_result.rc == 0
  no_log: true
  when: moodle_db_primary | default(true)

- name: Popravi vlasnistvo koda nakon instalacije (installer je pokrenut kao root)
  ansible.builtin.file:
    path: "{{ moodle_webroot }}"
    owner: apache
    group: apache
    recurse: true
  # moodle_dataroot (Blob mount) se namjerno ne dira ovdje - vec je
  # vlasnistvo postavljeno u mount_storage roli, a rekurzivni chown na
  # blobfuse2 mountu je nepotreban i moze biti spor/nepouzdan na FUSE sloju.
