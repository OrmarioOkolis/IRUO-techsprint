---
# Instalacija Moodlea (PHP/Apache/MariaDB) na VM cija je pohrana vec
# pripremljena rolom mount_storage (moodledata = Blob mount, MariaDB data dir
# = data disk).

# Moodle 5.1 zahtijeva PHP 8.2+. Rocky 9 AppStream default modul (php:8.1)
# nije dovoljan - koristi se Remi repozitorij (standardni izvor modernih PHP
# verzija za RHEL/Rocky) za PHP 8.3.
- name: Ukloni PHP pakete iz eventualnog starijeg modula/streama
  ansible.builtin.dnf:
    name:
      - php
      - php-cli
      - php-common
      - php-mysqlnd
      - php-gd
      - php-xml
      - php-mbstring
      - php-curl
      - php-zip
      - php-intl
      - php-soap
      - php-opcache
    state: absent

- name: Provjeri je li Remi repo vec dodan
  ansible.builtin.stat:
    path: /etc/yum.repos.d/remi.repo
  register: remi_repo_file

- name: Preuzmi Remi release RPM
  # Verzija u URL-u mora pratiti stvarni EL major (9 na Azureovom Rocky 9,
  # 8 na OpenStack RHA sandboxu koji koristi rhel8 image - vidi CLAUDE.md).
  ansible.builtin.get_url:
    url: "https://rpms.remirepo.net/enterprise/remi-release-{{ ansible_distribution_major_version }}.rpm"
    dest: /tmp/remi-release.rpm
    mode: "0644"
  when: not remi_repo_file.stat.exists

- name: Instaliraj Remi repozitorij (rpm --nodeps, ne dnf)
  # Live testirano 9.9.2026 na OpenStack RHEL8 sandboxu: `ansible.builtin.dnf`
  # (pa time i "yum install <url>") odbija paket - trenutna remi-release-8.rpm
  # (8.10-2) zahtijeva "redhat-release >= 8.10", a ovaj RHA image je RHEL 8.2
  # (stari, namjerno fiksirani point-release za konzistentnost vjezbi kolegija
  # - "dnf update" u common roli ne mijenja point-release broj). Stvarna
  # funkcionalna potreba je samo da se .repo fajl odloži u /etc/yum.repos.d/ -
  # rpm ovisnosti (redhat-release/epel-release verzija) su konzervativan gate
  # bez stvarnog funkcionalnog razloga za nas slucaj, pa se instalira izravno
  # preko rpm -Uvh --nodeps (zaobilazi dnf-ovu strozu provjeru ovisnosti).
  command: rpm -Uvh --nodeps /tmp/remi-release.rpm
  when: not remi_repo_file.stat.exists

- name: Resetiraj default PHP modul stream
  # cmd: dict oblik namjerno, ne free-form string - Ansible 2.9 (RHA
  # workstation) ne podrzava FQCN modul + free-form string + extra kljuc u
  # istom tasku. Vidi CLAUDE.md (live otkriveno 9.9.2026).
  command:
    cmd: dnf module reset -y php
  changed_when: true

- name: Omoguci PHP 8.3 modul stream (Remi)
  command:
    cmd: dnf module enable -y php:remi-8.3
  changed_when: true

# ---------------------------------------------------------------------------
# Live testirano 9.9.2026 na OpenStack RHEL8 sandboxu (nakon Remi fixa):
# Remi-in php-gd paket (8.3) ovisi o novijim slikovnim bibliotekama
# (libavif.so.14, libraqm.so.0, libimagequant.so.0) kojih nema ni u jednom
# omogucenom repou (isti "star RHEL8.2 image" razlog kao Remi problem ranije)
# - "nothing provides ..." unistava CIJELU dnf transakciju (dnf install je
# atoman - jedan nerjesivi paket blokira sve ostale u istom pozivu). EPEL
# obicno nosi te biblioteke; epel-release SAM PO SEBI (za razliku od
# remi-release) nema strogi redhat-release>=8.10 zahtjev pa prolazi kroz
# obican dnf. skip_broken je dodatna sigurnosna mreza (da php-gd, ako ipak
# ostane nerjesiv, ne blokira instalaciju SVEGA ostalog - Moodle radi i bez
# GD-a, samo s degradiranom slikovnom obradom).
# ---------------------------------------------------------------------------
- name: Omoguci EPEL (nedostajuce slikovne biblioteke za php-gd)
  ansible.builtin.dnf:
    name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
    state: present
    disable_gpg_check: true

- name: Instaliraj Apache, PHP 8.3 i potrebne ekstenzije
  ansible.builtin.dnf:
    name:
      - httpd
      - php
      - php-cli
      - php-common
      - php-mysqlnd
      - php-gd
      - php-xml
      - php-mbstring
      - php-curl
      - php-zip
      - php-intl
      - php-soap
      - php-opcache
      - unzip
      - git
    state: present
    skip_broken: true

- name: Postavi max_input_vars >= 5000 (Moodle zahtjev)
  ansible.builtin.lineinfile:
    path: /etc/php.ini
    regexp: "^;?\\s*max_input_vars\\s*="
    line: "max_input_vars = 5000"
  notify: restart httpd

- name: Instaliraj firewalld (nije na minimal cloud image-u)
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Pokreni i omoguci firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Otvori HTTP port u firewalld
  command:
    cmd: firewall-cmd --permanent --add-service=http
  register: firewalld_http
  changed_when: "'ALREADY_ENABLED' not in firewalld_http.stderr"

- name: Primijeni firewalld promjene
  command:
    cmd: firewall-cmd --reload
  changed_when: true

# ---------------------------------------------------------------------------
# MariaDB - datadir je vec mountan na data disk (mount_storage rola),
# poklapa se s paketnim defaultom /var/lib/mysql pa nije potrebna dodatna
# konfiguracija putanje. Moodle 5.1 zahtijeva MariaDB 10.11+, Rocky 9
# AppStream default je 10.5 - koristi se sluzbeni MariaDB repo.
# ---------------------------------------------------------------------------
- name: Ukloni stari mariadb-server (AppStream, prenizak za Moodle 5.1)
  ansible.builtin.dnf:
    name: mariadb-server
    state: absent

# ---------------------------------------------------------------------------
# Live testirano 9.9.2026 na OpenStack RHEL8 sandboxu (nakon EPEL/php-gd
# fixa): "MariaDB-server All matches were filtered out by modular filtering"
# - RHEL8 AppStream ima ugradjeni "mariadb" MODUL (stream 10.3 defaultno
# omogucen), a DNF modularno filtriranje SAKRIJE svaki paket s istim imenom
# iz BILO KOJEG repoa (ukljucujuci nas dodani mariadb.org repo) dok je taj
# modul aktivan - isti obrazac problema kao php modul ranije (vidi "Omoguci
# PHP 8.3 modul stream"), samo za mariadb. Bez reset/disable ovdje, "Instaliraj
# MariaDB 10.11" pada bez obzira sto repo/paket postoje.
# ---------------------------------------------------------------------------
- name: Onemoguci mariadb AppStream modul (blokira nas repo modularnim filtriranjem)
  command:
    cmd: dnf module disable -y mariadb
  changed_when: true

- name: Dodaj sluzbeni MariaDB repozitorij (10.11)
  ansible.builtin.yum_repository:
    name: mariadb
    description: MariaDB 10.11
    baseurl: https://rpm.mariadb.org/10.11/rhel/$releasever/$basearch
    gpgkey: https://rpm.mariadb.org/RPM-GPG-KEY-MariaDB
    gpgcheck: true

- name: Instaliraj MariaDB 10.11
  ansible.builtin.dnf:
    name: MariaDB-server
    state: present
    disable_gpg_check: true

- name: Popravi vlasnistvo /var/lib/mysql nakon mounta (prije inicijalizacije)
  ansible.builtin.file:
    path: "{{ mariadb_datadir }}"
    owner: mysql
    group: mysql
    mode: "0755"

- name: Provjeri je li MariaDB 10.11 vec inicijaliziran (nas marker)
  ansible.builtin.stat:
    path: "{{ mariadb_datadir }}/.techsprint_mariadb_1011_initialized"
  register: mariadb_1011_marker

- name: Ocisti stare (10.5) sistemske tablice - nekompatibilne s 10.11 (samo jednom)
  shell:
    cmd: rm -rf {{ mariadb_datadir }}/*
  when: not mariadb_1011_marker.stat.exists

- name: Inicijaliziraj MariaDB sistemske tablice (idempotentno)
  command:
    cmd: mariadb-install-db --datadir={{ mariadb_datadir }} --user=mysql
    creates: "{{ mariadb_datadir }}/mysql/user.MYD"

- name: Oznaci da je MariaDB 10.11 inicijalizacija zavrsena
  ansible.builtin.file:
    path: "{{ mariadb_datadir }}/.techsprint_mariadb_1011_initialized"
    state: touch
    owner: mysql
    group: mysql

- name: Pokreni i omoguci MariaDB
  ansible.builtin.systemd:
    name: mariadb
    state: started
    enabled: true

- name: Kreiraj Moodle bazu podataka
  command:
    cmd: >
      mysql -e "CREATE DATABASE IF NOT EXISTS {{ moodle_db_name }}
      CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
  changed_when: true

- name: Kreiraj Moodle DB korisnika i dodijeli prava (samo na moodle bazu)
  command:
    cmd: >
      mysql -e "CREATE USER IF NOT EXISTS '{{ moodle_db_user }}'@'localhost'
      IDENTIFIED BY '{{ moodle_db_password }}';
      GRANT ALL PRIVILEGES ON {{ moodle_db_name }}.* TO '{{ moodle_db_user }}'@'localhost';
      FLUSH PRIVILEGES;"
  no_log: true
  changed_when: true

# ---------------------------------------------------------------------------
# Moodle kod + config, dataroot pokazuje na blobfuse2-mountani direktorij
# (objektna pohrana, vidi mount_storage rolu).
# ---------------------------------------------------------------------------
- name: Dozvoli git operacije nad moodle_webroot (dubious ownership fix)
  command:
    cmd: git config --global --add safe.directory {{ moodle_webroot }}
  changed_when: true

- name: Preuzmi Moodle izvorni kod (git, tocan stabilni tag)
  ansible.builtin.git:
    repo: https://github.com/moodle/moodle.git
    dest: "{{ moodle_webroot }}"
    version: "{{ moodle_version }}"
    depth: 1
  become_user: root

- name: Postavi vlasnistvo Moodle koda na apache
  ansible.builtin.file:
    path: "{{ moodle_webroot }}"
    owner: apache
    group: apache
    recurse: true

- name: Postavi vlasnistvo moodledata (Blob mount) na apache
  ansible.builtin.file:
    path: "{{ moodle_dataroot }}"
    owner: apache
    group: apache
    mode: "0770"

- name: Generiraj Moodle config.php
  ansible.builtin.template:
    src: config.php.j2
    dest: "{{ moodle_webroot }}/config.php"
    owner: apache
    group: apache
    mode: "0640"
  no_log: true

- name: Generiraj Apache vhost za Moodle
  ansible.builtin.template:
    src: moodle.conf.j2
    dest: /etc/httpd/conf.d/moodle.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart httpd

- name: Instaliraj semanage alat (bez Python SELinux ovisnosti)
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present

- name: Postavi SELinux context za httpd na Moodle webroot
  command:
    cmd: semanage fcontext -a -t httpd_sys_rw_content_t "{{ moodle_webroot }}(/.*)?"
  register: semanage_result
  failed_when: semanage_result.rc != 0 and 'already defined' not in semanage_result.stderr
  changed_when: semanage_result.rc == 0

- name: Primijeni SELinux context (restorecon)
  command:
    cmd: restorecon -Rv {{ moodle_webroot }}
  changed_when: true

- name: Pokreni i omoguci Apache
  ansible.builtin.systemd:
    name: httpd
    state: started
    enabled: true

- name: Pokreni Moodle CLI instalaciju (idempotentno - preskace ako su tablice vec tu)
  command:
    cmd: >
      php admin/cli/install_database.php
      --agree-license
      --adminuser=admin --adminpass={{ moodle_admin_password }}
      --adminemail=admin@techsprint.local
      --fullname="{{ moodle_site_name }}" --shortname=TechSprint
    chdir: "{{ moodle_webroot }}"
  register: moodle_install_result
  failed_when: >
    moodle_install_result.rc != 0 and
    'already present' not in moodle_install_result.stderr
  changed_when: moodle_install_result.rc == 0
  no_log: true

- name: Popravi vlasnistvo koda nakon instalacije (installer je pokrenut kao root)
  ansible.builtin.file:
    path: "{{ moodle_webroot }}"
    owner: apache
    group: apache
    recurse: true
  # moodle_dataroot (Blob mount) se namjerno ne dira ovdje - vec je
  # vlasnistvo postavljeno u mount_storage roli, a rekurzivni chown na
  # blobfuse2 mountu je nepotreban i moze biti spor/nepouzdan na FUSE sloju.
