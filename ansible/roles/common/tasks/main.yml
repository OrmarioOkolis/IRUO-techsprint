---
# ---------------------------------------------------------------------------
# Dijeljeni remote_tmp direktorij (vidi group_vars/all.yml:
# ansible_remote_tmp: /tmp/.ansible-remote-tmp - potreban jer apache/drugi
# sistemski become_user-ovi nemaju writable home). Live testirano 9.9.2026:
# prvi task koji ga kreira postavlja mode 0700 (Ansiblov interni "umask 77 &&
# mkdir -p" bootstrap), pa SVAKA SLJEDECA konekcija koja ne dijeli isti
# efektivni vlasnik/session (npr. nakon cistenja SSH ControlPath socketa,
# ili druga faza become-a) puca s "Permission denied" na mkdir unutar tog
# direktorija - "unreachable", ne "failed", i poruka je cesto zakrivena ako
# je task s no_log:true (kao rclone config predlozak) jer Ansible tretira
# CIJELI rezultat kao osjetljiv kad no_log stoji, ukljucujuci i connection-
# level greske. ansible.builtin.raw namjerno - to je JEDINI modul koji ne
# ovisi o remote_tmp mehanizmu (izvrsava se izravno preko SSH-a, bez
# staging-a), pa moze popraviti permisije ODMAH, bez cega-i-jajeta problema.
# ---------------------------------------------------------------------------
- name: Osiguraj da je dijeljeni remote_tmp world-writable (sprijeci permission denied)
  # Kratko ime ("raw:", ne "ansible.builtin.raw:") - isti FQCN+free-form+
  # extra-kljuc bug kao ranije (command/shell), pogadja i raw modul na ovom
  # Ansible 2.9.11 instalu.
  raw: mkdir -p /tmp/.ansible-remote-tmp && chmod 1777 /tmp/.ansible-remote-tmp
  changed_when: false

- name: Azuriraj sve pakete
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true

- name: Postavi timezone na Europe/Zagreb
  # ansible.builtin.command umjesto community.general.timezone - live
  # testirano 9.9.2026: community.general 13.4.0 (najnoviji, ansible-galaxy
  # instalira default najnoviju verziju) modul zahtijeva noviji Python NA
  # CILJNOM hostu ("SyntaxError: future feature annotations is not defined"),
  # a RHEL8 image (OpenStack) ima sistemski python3 3.6 - ista klasa problema
  # kao ranije s Ansiblom 2.9 na kontroleru, ovaj put na managed node strani.
  # timedatectl je dio systemd-a, dostupan bez ikakve dodatne ovisnosti na
  # oba OS-a (RHEL8/Rocky 9).
  #
  # Kratko ime modula ("command:", NE "ansible.builtin.command:") - live
  # testirano 9.9.2026: FQCN prefiks na ovom Ansible 2.9.11 instalu ne
  # prepoznaje "cmd:" kao valjan parametar ("Unsupported parameters ...
  # Supported parameters include: _raw_params, ..."), samo "_raw_params"
  # (free-form string). Kratko ime modula ide kroz cijeli/ispravan
  # argument-spec (podrzava cmd/chdir/creates/...), FQCN na ovoj verziji
  # ocito ide kroz nepotpuni redirect shim. Vidi CLAUDE.md.
  command: timedatectl set-timezone Europe/Zagreb
  changed_when: true
