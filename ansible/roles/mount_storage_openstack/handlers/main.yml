---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart rclone-swift
  ansible.builtin.systemd:
    name: rclone-swift-moodledata.service
    state: restarted

- name: restart ceph-fuse-manila
  ansible.builtin.systemd:
    name: ceph-fuse-manila.service
    state: restarted
