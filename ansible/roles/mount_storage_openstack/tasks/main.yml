---
# Mount pohrane na Moodle VM (OpenStack): data disk (MariaDB), Swift preko
# rclone (objektna pohrana, moodledata) s developerovim VLASTITIM Keystone
# identitetom (least-privilege - vidi generate_inventory_openstack.py), Manila
# CephFS preko ceph-fuse (datotecna pohrana, backupi) s cephx access kljucem
# koji je Terraform vec generirao (openstack-compute-dev-terraform/storage.tf).
#
# NIJE JOS LIVE TESTIRANO u cijelosti (za razliku od Terraform strane koja je
# sva live-testirana) - ovo je prvi pokusaj, ocekuj da ce trebati popravaka
# nakon prvog stvarnog pokretanja (isti obrazac kao Manila share_proto/
# share_type/share_network otkrica - vidi CLAUDE.md).

- name: Instaliraj osnovne pakete (fuse, parted)
  ansible.builtin.dnf:
    name:
      - fuse3
      - fuse3-libs
      - parted
    state: present

# ---------------------------------------------------------------------------
# 1) Data disk (Cinder volume, drugi disk) -> MariaDB data dir. Potvrdjeno
#    live 9.9.2026 (`openstack volume list`): OpenStack/KVM prikazuje drugi
#    attached volume kao /dev/vdb (OS disk je /dev/vda) - stabilno, nema
#    Azureov "lun N" simlink sloj.
# ---------------------------------------------------------------------------
# community.general.filesystem/ansible.posix.mount NAMJERNO NISU koristeni
# ovdje - live testirano 9.9.2026: community.general.filesystem puknuo
# identicnim uzrokom kao ranije community.general.timezone ("SyntaxError:
# future feature annotations is not defined" - modul-kod izvrsen NA CILJNOM
# hostu, RHEL8 python3 3.6, kolekcija zahtijeva 3.7+). ansible.posix.mount
# nije ni stigao testirati se (host je vec pao na prethodnom tasku), ali
# preventivno izbjegnut isti rizik - zamijenjeno cistim ansible.builtin
# (dio ansible-core, ne posebne kolekcije, dokazano radi na ovim hostovima).
- name: Provjeri je li data disk vec formatiran (ext4)
  command: blkid -o value -s TYPE /dev/vdb
  register: vdb_blkid
  failed_when: false
  changed_when: false

- name: Formatiraj data disk kao ext4 (ako vec nije formatiran)
  command: mkfs.ext4 /dev/vdb
  when: vdb_blkid.stdout != "ext4"

- name: Kreiraj mount point za MariaDB data dir
  ansible.builtin.file:
    path: "{{ mariadb_datadir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Dodaj data disk u /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^/dev/vdb\\s"
    line: "/dev/vdb  {{ mariadb_datadir }}  ext4  defaults,noatime  0 2"

- name: Mountaj sve iz fstab (idempotentno - preskace vec mountano)
  command: mount -a
  changed_when: false

# ---------------------------------------------------------------------------
# 2) Swift (objektna pohrana) preko rclone. Kredencijali su developerov
#    VLASTITI Keystone username/password (scoped SAMO na njegov projekt/
#    kontejner preko project-scopinga - vidi openstack-i3-terraform - isto
#    nacelo least-privilegea kao Azure Managed Identity scoped na storage
#    account). rclone.conf sadrzi lozinku - 0600, root-only (isti obrazac kao
#    Azure /etc/smbcredentials-backups).
# ---------------------------------------------------------------------------
- name: Instaliraj fuse (rclone dolazi preko sluzbene install skripte, ne dnf)
  ansible.builtin.dnf:
    name: fuse
    state: present

- name: Provjeri je li rclone vec instaliran
  ansible.builtin.stat:
    path: /usr/bin/rclone
  register: rclone_bin

- name: Instaliraj rclone preko sluzbene install skripte
  # Live testirano 9.9.2026: rclone paket NE postoji u EPEL8 ("No package
  # rclone available") - umjesto dodavanja EPEL-a (nepouzdano, ovisi o
  # tocnoj verziji repoa), koristi se sluzbena rclone.org install skripta
  # (staticki binary, distro-neovisna, sluzbeno preporuceni nacin).
  shell: curl -fsSL https://rclone.org/install.sh | bash
  when: not rclone_bin.stat.exists
  changed_when: true

- name: Kreiraj moodledata direktorij (mount point za Swift)
  ansible.builtin.file:
    path: "{{ moodle_dataroot }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0770"

- name: Kreiraj rclone config direktorij
  ansible.builtin.file:
    path: /etc/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generiraj rclone config (Swift, developerov vlastiti identitet)
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /etc/rclone/rclone.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart rclone-swift

- name: Omoguci user_allow_other u /etc/fuse.conf (preduvjet za allow-other)
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    regexp: "^#?\\s*user_allow_other"
    line: "user_allow_other"
  notify: restart rclone-swift

- name: Instaliraj systemd unit za rclone Swift mount
  ansible.builtin.template:
    src: rclone-swift-mount.service.j2
    dest: /etc/systemd/system/rclone-swift-moodledata.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart rclone-swift

- name: Pokreni i omoguci rclone Swift mount servis
  ansible.builtin.systemd:
    name: rclone-swift-moodledata.service
    enabled: true
    state: started
    daemon_reload: true

- name: Omoguci httpd_use_fusefs SELinux boolean (Apache mora pisati na FUSE mount)
  # cmd: dict oblik namjerno, ne free-form string - Ansible 2.9 (RHA workstation)
  # ne podrzava FQCN modul + free-form string + extra kljuc (changed_when) u
  # istom tasku, samo kratko ime (npr. "command:") to podrzava. Vidi CLAUDE.md
  # (live otkriveno 9.9.2026, ista greska u moodle/mount_storage roli).
  command:
    cmd: setsebool -P httpd_use_fusefs on
  changed_when: true

# ---------------------------------------------------------------------------
# 3) Manila share (CephFS, datotecna pohrana - backupi) preko ceph-fuse.
#    Cephx kljuc je vec generiran u Terraformu (share_access_v2 resurs) -
#    Ansible ga samo cita i upisuje u keyring, ne generira ga sam.
# ---------------------------------------------------------------------------
- name: Instaliraj ceph-fuse
  ansible.builtin.dnf:
    name: ceph-fuse
    state: present

- name: Kreiraj /etc/ceph direktorij
  ansible.builtin.file:
    path: /etc/ceph
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generiraj cephx keyring za Manila access
  ansible.builtin.template:
    src: ceph-manila.keyring.j2
    dest: /etc/ceph/manila.keyring
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart ceph-fuse-manila

- name: Kreiraj backups mount point
  ansible.builtin.file:
    path: "{{ backups_mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Rastavi Manila export putanju (mon_addr + cephfs podputanja)
  # Format: "<mon_ip>:<mon_port>:/volumes/_nogroup/<share_instance_id>"
  ansible.builtin.set_fact:
    manila_mon_addr: "{{ manila_export_path.split(':')[0] }}:{{ manila_export_path.split(':')[1] }}"
    manila_cephfs_path: "{{ manila_export_path.split(':', 2)[2] }}"

- name: Instaliraj systemd unit za ceph-fuse Manila mount
  ansible.builtin.template:
    src: ceph-fuse-manila.service.j2
    dest: /etc/systemd/system/ceph-fuse-manila.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart ceph-fuse-manila

- name: Pokreni i omoguci ceph-fuse Manila mount servis
  ansible.builtin.systemd:
    name: ceph-fuse-manila.service
    enabled: true
    state: started
    daemon_reload: true
