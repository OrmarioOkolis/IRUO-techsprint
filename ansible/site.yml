---
# Glavni playbook. Pokreni nakon uspješnog `terraform apply` u azure-i4-terraform/:
#
#   python3 inventory/generate_inventory.py
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook site.yml
#
# Redoslijed je bitan: mount_storage MORA proći prije moodle role, jer Moodle
# instalacija piše u moodledata (Blob mount) i koristi MariaDB data dir (data disk).

- name: Priprema svih VM-ova (jump, lead, moodle)
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    # Svjez deploy: terraform apply zavrsi prije nego je sshd/cloud-init na
    # novim VM-ovima spreman -> bez ovoga prvi ansible-playbook run pada s
    # "UNREACHABLE / Connection closed by UNKNOWN". wait_for_connection ceka
    # da veza prodje (i kroz ProxyCommand na jump host).
    - name: Pricekaj da VM-ovi prihvate SSH vezu
      ansible.builtin.wait_for_connection:
        timeout: 420
        sleep: 10
    - name: Prikupi fakte nakon uspostave veze
      ansible.builtin.setup:
  roles:
    - common

- name: Mount pohrane na Moodle VM-ovima (data disk, Blob, Azure Files)
  hosts: moodle
  become: true
  roles:
    - mount_storage

- name: Instalacija Moodlea
  hosts: moodle
  become: true
  roles:
    - moodle
