---
# apache/druge sistemske korisnike nemaju writable home - remote_tmp mora
# biti negdje gdje SVAKI become_user (apache, root...) smije pisati.
ansible_remote_tmp: /tmp/.ansible-remote-tmp

moodle_dataroot: /var/www/moodledata
moodle_webroot: /var/www/html/moodle
mariadb_datadir: /var/lib/mysql
backups_mountpoint: /mnt/backups
blobfuse_cache_dir: /mnt/blobfusetmp

# Mora se poklapati s azure-i4-terraform/variables.tf var.admin_username
azure_admin_username: azureuser

moodle_version: MOODLE_501_STABLE
moodle_db_name: moodle
moodle_db_user: moodleuser
# PRIJE stvarnog deploymenta prepiši preko:
#   ansible-playbook site.yml -e moodle_db_password=<jaka-lozinka>
# ili group_vars/all.yml lokalno (ne commitaj stvarnu lozinku u git).
moodle_db_password: "Mario.nikolis2611"
moodle_admin_password: "Mario.nikolis2611"
moodle_site_name: "TechSprint Moodle – testna okolina"
